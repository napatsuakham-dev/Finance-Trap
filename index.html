* { font-family: 'Sarabun', sans-serif; box-sizing: border-box; }
html, body { height: 100%; margin: 0; width: 100%; }

.chat-app {
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: fixed;
  top: 0;
  left: 0;
}

/* Start screen */
.start-screen {
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  position: relative;
  overflow: hidden;
}
.start-screen::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 40%, rgba(229,57,53,0.08) 0%, transparent 50%),
              radial-gradient(circle at 70% 60%, rgba(255,193,7,0.06) 0%, transparent 50%);
  animation: floatBg 12s ease-in-out infinite alternate;
}
@keyframes floatBg { 0%{transform:translate(0,0)} 100%{transform:translate(-3%,-3%)} }
@keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
@keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
@keyframes bubbleIn { from{opacity:0;transform:scale(0.7) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
@keyframes dotBounce {
  0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)}
}
@keyframes slideInLeft { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }
@keyframes slideInRight { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes popIn { from{opacity:0;transform:scale(0.8)} to{opacity:1;transform:scale(1)} }
@keyframes wiggle { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-2deg)} 75%{transform:rotate(2deg)} }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes pulse-glow { 0%,100%{box-shadow:0 0 0 0 rgba(255,193,7,0.7)} 50%{box-shadow:0 0 0 8px rgba(255,193,7,0)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
.typing-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#888; margin:0 2px; }
.typing-dot:nth-child(1){animation:dotBounce 1.2s infinite 0s}
.typing-dot:nth-child(2){animation:dotBounce 1.2s infinite 0.2s}
.typing-dot:nth-child(3){animation:dotBounce 1.2s infinite 0.4s}

.bubble-anim { animation: bubbleIn 0.3s ease-out forwards; }
.choice-btn {
  transition: all 0.15s ease;
}
.choice-btn:active {
  transform: scale(0.97);
}
.choice-btn:hover {
  animation: pulse-glow 1.5s infinite;
  transform: translateY(-2px);
}

/* Bubble animations */
.jen-bubble, .player-bubble, .admin-bubble, .officer-bubble, .mint-bubble, .friend-bubble {
  transition: all 0.3s ease;
}
.jen-bubble:hover, .player-bubble:hover, .admin-bubble:hover, .officer-bubble:hover, .mint-bubble:hover, .friend-bubble:hover {
  transform: scale(1.02);
}

/* Warning shake animation */
.shake-anim {
  animation: shake 0.3s ease-in-out;
}

/* Bounce for important messages */
.bounce-anim {
  animation: bounce 0.6s ease-in-out;
}

/* Chat area */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px;
  scroll-behavior: smooth;

.chat-messages::-webkit-scrollbar { width: 0; }

  <script>
    // Initialize audio context for sound effects
    let audioContext = null;
    const soundCache = {};
    
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    
    // Play notification sound
    function playSound(type = 'notification') {
      try {
        initAudio();
        if (!audioContext) return;
        
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        
        osc.connect(gain);
        gain.connect(audioContext.destination);
        
        if (type === 'notification') {
          // Two-tone notification
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.setValueAtTime(1000, now + 0.05);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.setValueAtTime(0, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'success') {
          // Success chime
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(659, now + 0.1);
          osc.frequency.setValueAtTime(784, now + 0.2);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.setValueAtTime(0, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'warning') {
          // Warning beep
          osc.frequency.setValueAtTime(300, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.setValueAtTime(0, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (e) {
        // Silently fail if audio not supported
      }
    }

  font_size: 15
};

function getConfig() {
  return window.elementSdk?.config || defaultConfig;
}

function applyConfig(config) {
  const c = { ...defaultConfig, ...config };
  if (c.player_name && c.player_name.trim()) {
    playerName = c.player_name;
    const ni = document.getElementById('nameInput');
    if (ni) ni.value = playerName;
  }
  const chatBody = document.getElementById('chatBody');
  if (chatBody) chatBody.style.background = c.background_color;
  const header = document.getElementById('chatHeader');
  if (header) header.style.background = c.primary_action_color;

  document.querySelectorAll('.jen-bubble').forEach(el => {
    el.style.background = c.surface_color;
    el.style.color = c.text_color;
  });
  document.querySelectorAll('.player-bubble').forEach(el => {
    el.style.background = c.primary_action_color;
  });
  document.querySelectorAll('.choice-btn').forEach(el => {
    el.style.background = c.surface_color;
    el.style.color = c.text_color;
    el.style.borderColor = c.primary_action_color;
  });

  const ff = c.font_family + ', Sarabun, sans-serif';
  document.body.style.fontFamily = ff;
  const fs = c.font_size;
  document.querySelectorAll('.jen-bubble, .player-bubble').forEach(el => {
    el.style.fontFamily = ff;
    el.style.fontSize = fs + 'px';
  });
}

    onConfigChange: async (config) => { applyConfig(config); },
    mapToCapabilities: (config) => {
      const c = { ...defaultConfig, ...config };
      function mut(key) {
        return {
          get: () => c[key] || defaultConfig[key],
          set: (v) => { c[key] = v; window.elementSdk.setConfig({ [key]: v }); }
        };
      }
      return {
        recolorables: [
          mut('background_color'),
          mut('surface_color'),
          mut('text_color'),
          mut('primary_action_color'),
          mut('secondary_action_color')
        ],
        borderables: [],
        fontEditable: mut('font_family'),
        fontSizeable: mut('font_size')
      };
    },
    mapToEditPanelValues: (config) => {
      const c = { ...defaultConfig, ...config };
      return new Map([
        ['player_name', c.player_name || ''],
        ['current_level', c.current_level || '1']
      ]);
    }
  });
}

// Detect level from config
function getTurnsForCurrentLevel() {
  const config = getConfig();
  const level = parseInt(config.current_level || '1');
  return level === 5 ? turns5 : (level === 4 ? turns4 : (level === 3 ? turns3 : (level === 2 ? turns2 : turns)));
}

// Track character for level
function getCharacterForLevel() {
  const config = getConfig();
  const level = parseInt(config.current_level || '1');
  if (level === 5) {
    return { name: 'Admin Boutique', emoji: '📱', color: '#22c55e' };
  } else if (level === 4) {
    return { name: 'บี', emoji: '👫', color: '#f59e0b' };
  } else if (level === 3) {
    return { name: 'มิ้นท์', emoji: '💕', color: '#ec4899' };
  } else if (level === 2) {
    return { name: 'สารวัตร วิเชียร', emoji: '👮‍♀️', color: '#6b7280' };
  } else {
    return { name: 'เจน', emoji: '👩', color: '#a78bfa' };
  }
}

function getTimeStr() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  return `${h}:${m}`;
}

function scrollToBottom() {
  const cb = document.getElementById('chatBody');
  if (cb) cb.scrollTop = cb.scrollHeight;
}

function addBubble(type, content) {
  const cb = document.getElementById('chatBody');
  const config = getConfig();
  const wrapper = document.createElement('div');
  wrapper.className = 'bubble-anim';
  wrapper.style.cssText = `display:flex;margin-bottom:6px;${type === 'player' ? 'justify-content:flex-end' : 'justify-content:flex-start'}`;

  if (type === 'sticker') {
    wrapper.innerHTML = `<div class="sticker-box" style="animation:popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)">${content}</div>`;
  } else if (type === 'image') {
    wrapper.innerHTML = `<div class="img-placeholder" style="background:${config.surface_color || '#fff'};color:${config.text_color || '#333'};animation:slideInLeft 0.4s ease-out">${content}</div>`;
  } else {
    // Determine colors based on sender type
    let bg, clr, cls, ff, fs, slideDir;
    
    if (type === 'admin') {
      bg = '#22c55e';
      clr = '#fff';
      cls = 'admin-bubble';
      slideDir = 'left';
    } else if (type === 'officer') {
      bg = '#5a5a5a';
      clr = '#fff';
      cls = 'officer-bubble';
      slideDir = 'left';
    } else if (type === 'mint') {
      bg = '#ec4899';
      clr = '#fff';
      cls = 'mint-bubble';
      slideDir = 'left';
    } else if (type === 'friend') {
      bg = '#f59e0b';
      clr = '#fff';
      cls = 'friend-bubble';
      slideDir = 'left';
    } else if (type === 'player') {
      bg = config.primary_action_color || '#7b5ea7';
      clr = '#fff';
      cls = 'player-bubble';
      slideDir = 'right';
    } else {
      bg = config.surface_color || '#fff';
      clr = config.text_color || '#333';
      cls = 'jen-bubble';
      slideDir = 'left';
    }
    
    ff = (config.font_family || 'Sarabun') + ', Sarabun, sans-serif';
    fs = config.font_size || 15;
    
    const bubble = document.createElement('div');
    bubble.className = cls;
    const slideAnim = slideDir === 'left' ? 'slideInLeft' : 'slideInRight';
    bubble.style.cssText = `background:${bg};color:${clr};font-size:${fs}px;font-family:${ff};animation:${slideAnim} 0.3s ease-out`;
    bubble.innerHTML = content;
    wrapper.appendChild(bubble);
    cb.appendChild(wrapper);
    scrollToBottom();
    
    // Play sound on message
    playSound('notification');
    return;
  }

  cb.appendChild(wrapper);
  scrollToBottom();
}

function showTyping() {
  const cb = document.getElementById('chatBody');
  const el = document.createElement('div');
  el.id = 'typingIndicator';
  el.className = 'bubble-anim';
  el.style.cssText = 'display:flex;margin-bottom:6px';
  el.innerHTML = `<div style="background:#fff;padding:10px 16px;border-radius:4px 16px 16px 16px"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
  cb.appendChild(el);
  scrollToBottom();
  document.getElementById('statusText').textContent = 'กำลังพิมพ์…';
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
  document.getElementById('statusText').textContent = 'ออนไลน์';
}

function showChoices(choices) {
  const area = document.getElementById('choicesArea');
  const config = getConfig();
  area.style.display = 'block';
  area.innerHTML = '';
  choices.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.style.cssText = `display:block;width:100%;text-align:left;padding:10px 14px;margin-bottom:6px;border-radius:20px;border:1.5px solid ${config.primary_action_color || '#7b5ea7'};background:${config.surface_color || '#fff'};color:${config.text_color || '#333'};font-size:${(config.font_size || 15) - 1}px;font-family:${(config.font_family || 'Sarabun')}, Sarabun, sans-serif;cursor:pointer;line-height:1.4`;
    btn.textContent = `${String.fromCharCode(65 + i)}. ${text}`;
    btn.onclick = () => selectChoice(text, i);
    area.appendChild(btn);
  });
  scrollToBottom();
}

function selectChoice(text, choiceIndex) {
  document.getElementById('choicesArea').style.display = 'none';
  document.getElementById('choicesArea').innerHTML = '';

  // Track choice with dynamic points - get points for this specific choice in this specific question
  const config = getConfig();
  const level = parseInt(config.current_level || '1');
  const levelPoints = choicePoints[level] || [];
  const questionPoints = levelPoints[currentTurn] || [0, 0, 0, 0];  // [A, B, C, D]
  const points = questionPoints[choiceIndex] || 0;  // Get score for selected choice
  
  choiceHistory.push({ choiceIndex, points });

  // Add time stamp
  const cb = document.getElementById('chatBody');
  const timeDiv = document.createElement('div');
  timeDiv.style.cssText = 'text-align:center;font-size:11px;color:rgba(255,255,255,0.6);margin:8px 0';
  timeDiv.textContent = getTimeStr();
  cb.appendChild(timeDiv);

  addBubble('player', text);
  playSound('notification');

  currentTurn++;
  const allTurns = getTurnsForCurrentLevel();
  if (currentTurn < allTurns.length) {
    setTimeout(() => playTurn(currentTurn), 800);
  } else {
    // End of chapter with analysis
    setTimeout(() => showEndAnalysis(), 1000);
  }
}

function showEndAnalysis() {
  const cb = document.getElementById('chatBody');
  const config = getConfig();
  const level = parseInt(config.current_level || '1');

  // Calculate total score from all choices
  let levelScore = 0;
  choiceHistory.forEach(entry => {
    levelScore += entry.points;
  });

  let emoji = '';
  let title = '';
  let insight = '';
  let reflectionQ = '';
  let grade = '';

  // Determine grade based on score (max 10 choices per level = 30 pts)
  if (levelScore >= 24) {
    grade = 'S';

function showFinalSummary() {

  // Calculate overall grade from all 5 levels

  let totalScore = 0;
  let completedLevelCount = 0;
  
  for (let i = 1; i <= 5; i++) {
    if (levelProfiles[i]) {
      totalScore += levelProfiles[i].levelScore || 0;
      completedLevelCount++;
    }
  }
  
  let overallGrade = '';
  let overallEmoji = '';
  let overallTitle = '';
  let overallDesc = '';

  // 135-150: ระดับ S

  const summaryDiv = document.createElement('div');
  summaryDiv.className = 'bubble-anim';
  summaryDiv.style.cssText = `text-align:center;padding:24px 16px;margin-top:20px;background:rgba(255,255,255,0.08);border-radius:16px;border:2px solid ${config.secondary_action_color || '#e53935'}`;
  summaryDiv.innerHTML = `
    <div style="font-size:64px;margin-bottom:16px">${overallEmoji}</div>
    <div style="color:#fff;font-weight:700;font-size:22px;margin-bottom:8px">ผลสรุปรวม 5 ด่าน</div>
    <div style="color:${config.secondary_action_color || '#e53935'};font-weight:700;font-size:20px;margin-bottom:8px">ระดับ: ${overallGrade}</div>
    <div style="color:#fff;font-weight:600;font-size:18px;margin-bottom:16px">${overallTitle}</div>
    <div style="color:rgba(255,255,255,0.85);font-size:13px;line-height:1.8;margin-bottom:20px;max-width:320px;margin-left:auto;margin-right:auto;white-space:pre-line">
      ${overallDesc}
    </div>
    <div style="background:rgba(0,0,0,0.2);padding:16px;border-radius:12px;margin:20px 0;text-align:left;max-width:340px;margin-left:auto;margin-right:auto">
      <div style="color:rgba(255,255,255,0.8);font-weight:600;font-size:12px;margin-bottom:12px">📊 ผลสรุปทั้ง 5 ด่าน (รวม ${totalScore}/150 คะแนน):</div>
      ${profilesHTML}
    </div>
    <button onclick="location.reload()" style="margin-top:20px;background:${config.secondary_action_color || '#e53935'};color:#fff;border:none;border-radius:20px;padding:12px 32px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">🔄 เล่นใหม่</button>
  `;
  cb.appendChild(summaryDiv);
  scrollToBottom();
}

async function playTurn(turnIdx) {
  const allTurns = getTurnsForCurrentLevel();
  const turn = allTurns[turnIdx];
  const msgs = turn.messages;

  for (let i = 0; i < msgs.length; i++) {
    const msg = msgs[i];
    const delay = msg.delay || (i === 0 ? 600 : 1000);

    if (msg.type === 'officer' || msg.type === 'jen' || msg.type === 'mint' || msg.type === 'friend' || msg.type === 'admin' || msg.type === 'sticker' || msg.type === 'image') {
      showTyping();
      await sleep(delay);
      hideTyping();
    }

    if (msg.type === 'jen' || msg.type === 'officer' || msg.type === 'mint' || msg.type === 'friend' || msg.type === 'admin') {
      addBubble(msg.type, msg.text());
    } else if (msg.type === 'sticker') {
      addBubble('sticker', msg.emoji);
    } else if (msg.type === 'image') {
      addBubble('image', `<div style="font-size:28px">${msg.label.substring(0, 2)}</div><div style="font-size:12px;font-weight:600">${msg.label.substring(2)}</div><div style="font-size:11px;color:#888">${msg.sublabel}</div>`);
    }

    await sleep(300);
  }

  // Add read timestamp
  const cb = document.getElementById('chatBody');
  const timeDiv = document.createElement('div');
  timeDiv.style.cssText = 'text-align:center;font-size:11px;color:rgba(255,255,255,0.6);margin:8px 0';
  timeDiv.textContent = getTimeStr();
  cb.appendChild(timeDiv);

  showChoices(turn.choices);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showLevelSelect() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name) {
    const msg = document.createElement('div');
    msg.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#e53935;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999';
    msg.textContent = 'กรุณาใส่ชื่อของคุณ';
    document.body.appendChild(msg);
    setTimeout(() => msg.remove(), 2000);
    return;
  }
  
  playerName = name;
  window.elementSdk.setConfig({ player_name: name });
  
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('levelScreen').style.display = 'flex';
}

function selectLevel(level) {
  currentLevel = level;
  window.elementSdk.setConfig({ current_level: String(level) });
  
  document.getElementById('levelScreen').style.display = 'none';
  const cs = document.getElementById('chatScreen');
  cs.style.display = 'flex';

  currentTurn = 0;
  choiceHistory = [];
  document.getElementById('chatBody').innerHTML = '';
  
  // Update character and header for selected level
  updateHeaderForLevel();
  
  playTurn(0);
}

function markLevelComplete(level) {
  const completedLevels = JSON.parse(localStorage.getItem('completedLevels') || '[]');
  if (!completedLevels.includes(level)) {
    completedLevels.push(level);
    localStorage.setItem('completedLevels', JSON.stringify(completedLevels));
    updateLevelCheckmarks();
  }
}

function updateLevelCheckmarks() {
  const completedLevels = JSON.parse(localStorage.getItem('completedLevels') || '[]');
  for (let i = 1; i <= 5; i++) {
    const btn = document.querySelector(`button[onclick="selectLevel(${i})"]`);
    if (btn) {
      const checkmark = btn.querySelector('.level-checkmark');
      if (checkmark) {
        checkmark.style.display = completedLevels.includes(i) ? 'block' : 'none';
      }
    }
  }
}

function goBackToLevelSelect() {
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('levelScreen').style.display = 'flex';
  currentTurn = 0;
  choiceHistory = [];
  document.getElementById('chatBody').innerHTML = '';
  levelProfiles = {};
}
